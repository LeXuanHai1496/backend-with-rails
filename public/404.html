<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <title>Backend with Rails</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      * { margin: 0; }

      body {
        background: #fff;
        color: #261b23;
        display: grid;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.4;
        min-height: 100dvh;
        place-items: center;
      }

      main {
        display: grid;
        gap: 1em;
        padding: 2em;
        text-align: center;
        width: min(100%, 32em);
      }

      .status {
        align-items: center;
        background: #e8f7ee;
        border-radius: 999px;
        color: #1a7f45;
        display: inline-flex;
        font-size: 0.9rem;
        font-weight: 600;
        gap: 0.5em;
        justify-self: center;
        padding: 0.4em 1em;
      }

      .dot {
        background: #1a7f45;
        border-radius: 50%;
        height: 0.6em;
        width: 0.6em;
      }

      h1 { font-size: 2rem; }
      p { color: #6b6068; }

      a {
        color: inherit;
        font-weight: 700;
        text-underline-offset: 0.15em;
      }

      @media (prefers-color-scheme: dark) {
        body { background: #101010; color: #e0e0e0; }
        p { color: #a79da4; }
        .status { background: #12301f; color: #5fd68f; }
        .dot { background: #5fd68f; }
      }
    </style>
  </head>
  <body>
    <main>
      <span class="status"><span class="dot"></span> Server is running</span>
      <h1>Backend with Rails</h1>
      <p>Ứng dụng đã được deploy thành công trên Render.</p>
      <p><a href="/up">Kiểm tra health check</a></p>
    </main>
  </body>
</html>
