version: "3.0"
services:
  database:
    image: postgres:16-alpine
    container_name: database
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=backend-with-rails
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d backend-with-rails"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    command: bash -c "rm -f tmp/pids/server.pid && rails db:migrate && bundle exec rails s -b 0.0.0.0 -p 3000"
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://admin:admin@database:5432/backend-with-rails
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
volumes:
  postgres-data:
